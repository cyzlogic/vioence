<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>violence.cc</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- animated rain-forest background (footage, self-hosted) -->
  <div class="bg-layer" aria-hidden="true">
    <video
      class="bg-video"
      id="bg-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="assets/rain-forest-poster.jpg">
      <source src="assets/rain-forest.mp4" type="video/mp4" />
    </video>
    <div class="bg-fog"></div>
  </div>
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- vignette to keep text readable -->
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- homepage hub screen -->
  <div id="hub-container">
    <main class="stage">
      <h1 class="violence-title">VIOLENCE</h1>
      <div class="hub-nav">
        <button id="nav-btn-logic" class="hub-btn" type="button">logic</button>
        <button id="nav-btn-homicide" class="hub-btn" type="button">homicide</button>
        <button id="nav-btn-elijah" class="hub-btn" type="button">elijah</button>
      </div>
    </main>

    <!-- minimalist fatal-style footer -->
    <footer class="foot">
      <p class="foot-brand">VIOLENCE.CC</p>
      <p class="foot-alias">~ logic</p>
      <p class="foot-copy">© 2026</p>
    </footer>
  </div>

  <!-- logic biolink screen -->
  <div id="biolink-container" class="biolink-view" data-profile="logic" aria-hidden="true">
    <video id="biolink-video" class="biolink-video-bg" autoplay loop muted playsinline>
      <source src="dubai-bg.mp4" type="video/mp4" />
    </video>
    <div class="biolink-bg-overlay"></div>

    <div class="biolink-card" id="biolink-card">
      <button id="biolink-close" class="biolink-back-btn" type="button" title="Back" aria-label="Back">✕</button>

      <!-- Profile Header -->
      <div class="biolink-profile">
        <div class="biolink-avatar" aria-label="Avatar">
          <img src="logicpfp.png" alt="Logic" class="biolink-avatar-img" />
        </div>
        <div class="biolink-info">
          <h1 class="biolink-name shining-text">LOGIC</h1>
          <p class="biolink-sub">Joined over 2 years ago</p>
        </div>
      </div>

      <!-- Footer Metadata -->
      <div class="biolink-meta">
        <div class="biolink-meta-item">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <span class="glitch-views" data-views="logic">999</span>
        </div>
        <div class="biolink-meta-item">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          <span>violence.cc</span>
        </div>
        <div class="biolink-shade">
          <input class="alpha-slider" type="range" min="5" max="90" value="26" aria-label="Card transparency" />
        </div>
      </div>
    </div>
  </div>

  <!-- elijah biolink screen -->
  <div id="biolink-container-elijah" class="biolink-view" data-profile="elijah" aria-hidden="true">
    <video id="biolink-video-elijah" class="biolink-video-bg" autoplay loop muted playsinline preload="auto" poster="elijah-bg-poster.jpg">
      <source src="elijah-bg.mp4" type="video/mp4" />
    </video>
    <div class="biolink-bg-overlay"></div>

    <div class="biolink-card" id="biolink-card-elijah">
      <button id="biolink-close-elijah" class="biolink-back-btn" type="button" title="Back" aria-label="Back">✕</button>

      <!-- Profile Header -->
      <div class="biolink-profile">
        <div class="biolink-avatar" aria-label="Avatar">
          <img src="elipfp.png" alt="Elijah" class="biolink-avatar-img" />
        </div>
        <div class="biolink-info">
          <h1 class="biolink-name shining-text">ELIJAH</h1>
          <p class="biolink-sub">violence.cc</p>
        </div>
      </div>

      <!-- Footer Metadata -->
      <div class="biolink-meta">
        <div class="biolink-meta-item">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <span class="glitch-views" data-views="elijah">999</span>
        </div>
        <div class="biolink-meta-item">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          <span>violence.cc</span>
        </div>
        <div class="biolink-shade">
          <input class="alpha-slider" type="range" min="5" max="90" value="26" aria-label="Card transparency" />
        </div>
      </div>
    </div>
  </div>

  <!-- mute toggle button on bottom right -->
  <button id="mute-btn" class="mute-btn" type="button" aria-label="Toggle mute" title="Mute / Unmute">
    <svg id="icon-sound" class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <svg id="icon-muted" class="mute-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <!-- hidden audio player -->
  <iframe id="audio" class="ghost" title="audio"
    allow="autoplay; encrypted-media"
    src="https://w.soundcloud.com/player/?visual=false&url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F775731544&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&sharing=false&download=false&show_playcount=false">
  </iframe>

  <!-- SoundCloud Widget API -->
  <script src="sc-api.js"></script>
  <script>
    var hubContainer = document.getElementById("hub-container");

    // Each profile gets its own biolink view. Both share .biolink-view styling.
    var profiles = {
      logic: {
        container: document.getElementById("biolink-container"),
        video: document.getElementById("biolink-video"),
        card: document.getElementById("biolink-card"),
        closeBtn: document.getElementById("biolink-close")
      },
      elijah: {
        container: document.getElementById("biolink-container-elijah"),
        video: document.getElementById("biolink-video-elijah"),
        card: document.getElementById("biolink-card-elijah"),
        closeBtn: document.getElementById("biolink-close-elijah")
      }
    };

    var activeProfile = null;

    function resetCardPosition(card) {
      if (!card) return;
      card.style.position = '';
      card.style.left = '';
      card.style.top = '';
      card.style.margin = '';
      card.classList.remove('dragging', 'card-pop');
    }

    function openBiolink(name) {
      var p = profiles[name];
      if (!p || !p.container) return;
      resetCardPosition(p.card);

      hubContainer.classList.add("page-hidden");
      p.container.classList.add("active");
      p.container.setAttribute("aria-hidden", "false");

      if (p.video) {
        try { p.video.currentTime = 0; } catch (err) {}
        p.video.play().catch(function () {});
      }

      activeProfile = name;
      startGlitchViews(name);
    }

    function closeBiolink() {
      if (!activeProfile) return;
      var p = profiles[activeProfile];
      if (p && p.container) {
        p.container.classList.remove("active");
        p.container.setAttribute("aria-hidden", "true");
        if (p.video) p.video.pause();
      }
      hubContainer.classList.remove("page-hidden");
      activeProfile = null;
      stopGlitchViews();
    }

    // wire up each profile's close button
    Object.keys(profiles).forEach(function (name) {
      var btn = profiles[name].closeBtn;
      if (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          closeBiolink();
        });
      }
    });

    window.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && activeProfile) {
        closeBiolink();
      }
    });

    // Support URL params for direct screenshotting/linking:
    // ?biolink / ?logic -> logic, ?elijah -> elijah
    var params = new URLSearchParams(window.location.search);
    if (params.has("elijah")) {
      openBiolink("elijah");
    } else if (params.has("biolink") || params.has("logic")) {
      openBiolink("logic");
    }

    // 3D tilt + cursor-tracking glow, applied to whichever card is hovered
    Object.keys(profiles).forEach(function (name) {
      var card = profiles[name].card;
      if (!card) return;

      card.addEventListener("mousemove", function (e) {
        var rect = card.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var centerX = rect.width / 2;
        var centerY = rect.height / 2;
        var rotateX = ((y - centerY) / centerY) * -9;
        var rotateY = ((x - centerX) / centerX) * 9;

        card.style.setProperty("--mouse-x", x + "px");
        card.style.setProperty("--mouse-y", y + "px");
        card.style.transform = "perspective(1000px) rotateX(" + rotateX.toFixed(2) + "deg) rotateY(" + rotateY.toFixed(2) + "deg) scale3d(1.02, 1.02, 1.02)";
      });

      card.addEventListener("mouseleave", function () {
        card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
      });
    });

    var btnLogic = document.getElementById("nav-btn-logic");
    var btnHomicide = document.getElementById("nav-btn-homicide");
    var btnElijah = document.getElementById("nav-btn-elijah");

    if (btnLogic) {
      btnLogic.addEventListener("click", function (e) {
        e.stopPropagation();
        openBiolink("logic");
      });
    }

    function triggerShakeRed(elem) {
      elem.classList.remove("shake-red");
      void elem.offsetWidth;
      elem.classList.add("shake-red");
      setTimeout(function () {
        elem.classList.remove("shake-red");
      }, 700);
    }

    if (btnHomicide) {
      btnHomicide.addEventListener("click", function (e) {
        e.stopPropagation();
        triggerShakeRed(btnHomicide);
      });
    }

    if (btnElijah) {
      btnElijah.addEventListener("click", function (e) {
        e.stopPropagation();
        openBiolink("elijah");
      });
    }

    // Glitched views counter, per profile
    var glitchSequence = ["999", "400", "763", "666", "1,337", "404", "666", "999", "821", "666"];
    var glitchIndex = 0;
    var glitchInterval = null;
    var glitchEls = {};

    Object.keys(profiles).forEach(function (name) {
      var el = profiles[name].container
        ? profiles[name].container.querySelector('.glitch-views[data-views="' + name + '"]')
        : null;
      if (el) glitchEls[name] = el;
    });

    function startGlitchViews(name) {
      if (glitchInterval) clearInterval(glitchInterval);
      var el = glitchEls[name];
      if (!el) return;
      glitchInterval = setInterval(function () {
        glitchIndex = (glitchIndex + 1) % glitchSequence.length;
        el.classList.add("glitching");
        el.textContent = glitchSequence[glitchIndex];
        setTimeout(function () {
          el.classList.remove("glitching");
        }, 220);
      }, 1100);
    }

    function stopGlitchViews() {
      if (glitchInterval) {
        clearInterval(glitchInterval);
        glitchInterval = null;
      }
    }

    // ---------------- animated rain (canvas) ----------------
    var rainCanvas = document.getElementById("rain");
    if (rainCanvas && rainCanvas.getContext) {
      var rctx = rainCanvas.getContext("2d");
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var RW = 0, RH = 0;
      var drops = [];
      var splashes = [];
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // angle: rain falls down-right; wind pushes it across
      var ANGLE = 0.20;
      var WIND = 0.55;

      function sizeRain() {
        RW = window.innerWidth;
        RH = window.innerHeight;
        rainCanvas.width = Math.floor(RW * dpr);
        rainCanvas.height = Math.floor(RH * dpr);
        rainCanvas.style.width = RW + "px";
        rainCanvas.style.height = RH + "px";
        rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildDrops();
      }

      function buildDrops() {
        // density scales with viewport, but capped for perf
        var count = Math.min(Math.floor((RW * RH) / 5200), 620);
        drops = [];
        for (var i = 0; i < count; i++) {
          drops.push(makeDrop(true));
        }
      }

      function makeDrop(spread) {
        // three depth tiers: near = faster/longer/brighter
        var tier = Math.random();
        var speed, len, alpha, thick;
        if (tier > 0.82) {          // near
          speed = 15 + Math.random() * 9;
          len   = 26 + Math.random() * 26;
          alpha = 0.42 + Math.random() * 0.32;
          thick = 1.5;
        } else if (tier > 0.45) {   // mid
          speed = 10 + Math.random() * 6;
          len   = 16 + Math.random() * 18;
          alpha = 0.24 + Math.random() * 0.24;
          thick = 1.1;
        } else {                    // far
          speed = 6 + Math.random() * 4;
          len   = 9 + Math.random() * 12;
          alpha = 0.10 + Math.random() * 0.16;
          thick = 0.8;
        }
        return {
          x: Math.random() * (RW + 220) - 110,
          y: spread ? Math.random() * RH : -len - Math.random() * 90,
          len: len,
          speed: speed,
          alpha: alpha,
          thick: thick
        };
      }

      function spawnSplash(x, y) {
        if (splashes.length > 90) return;
        splashes.push({ x: x, y: y, r: 0.6, life: 1 });
      }

      var flashAlpha = 0;
      var nextFlash = 260 + Math.random() * 620;

      function drawRain() {
        rctx.clearRect(0, 0, RW, RH);

        // lightning flash wash
        if (flashAlpha > 0.004) {
          rctx.fillStyle = "rgba(180, 200, 220," + (flashAlpha * 0.16).toFixed(3) + ")";
          rctx.fillRect(0, 0, RW, RH);
        }

        rctx.lineCap = "round";

        for (var i = 0; i < drops.length; i++) {
          var d = drops[i];

          var dx = d.len * Math.sin(ANGLE);
          var dy = d.len * Math.cos(ANGLE);

          rctx.beginPath();
          rctx.strokeStyle = "rgba(198, 214, 226, " + d.alpha.toFixed(3) + ")";
          rctx.lineWidth = d.thick;
          rctx.moveTo(d.x, d.y);
          rctx.lineTo(d.x + dx, d.y + dy);
          rctx.stroke();

          d.y += d.speed;
          d.x += d.speed * WIND * 0.5;

          if (d.y > RH + 30 || d.x > RW + 140) {
            // occasional splash where a near drop hits "the ground"
            if (d.speed > 16 && d.y > RH - 40) spawnSplash(d.x, RH - Math.random() * 26);
            var nd = makeDrop(false);
            d.x = nd.x;
            d.y = nd.y;
            d.len = nd.len;
            d.speed = nd.speed;
            d.alpha = nd.alpha;
            d.thick = nd.thick;
          }
        }

        // splash rings
        for (var s = splashes.length - 1; s >= 0; s--) {
          var sp = splashes[s];
          sp.r += 0.55;
          sp.life -= 0.045;
          if (sp.life <= 0) { splashes.splice(s, 1); continue; }
          rctx.beginPath();
          rctx.strokeStyle = "rgba(190, 208, 222, " + (sp.life * 0.20).toFixed(3) + ")";
          rctx.lineWidth = 1;
          rctx.ellipse(sp.x, sp.y, sp.r * 1.8, sp.r * 0.5, 0, 0, Math.PI * 2);
          rctx.stroke();
        }

        // decay flash
        if (flashAlpha > 0) flashAlpha *= 0.90;

        nextFlash -= 1;
        if (nextFlash <= 0) {
          flashAlpha = 0.55 + Math.random() * 0.45;
          nextFlash = 420 + Math.random() * 900;
        }

        requestAnimationFrame(drawRain);
      }

      sizeRain();
      window.addEventListener("resize", sizeRain);

      if (reduced) {
        // honour reduced-motion: one static frame, no loop
        rctx.clearRect(0, 0, RW, RH);
      } else {
        requestAnimationFrame(drawRain);
      }
    }

    // Draggable biolink cards + click pop effect.
    // Drag from anywhere on the card except the X button; a clean
    // click (no drag) triggers a bounce pop. Touch supported.
    // Position resets to center every time a profile is opened.
    function makeCardDraggable(card, closeBtn) {
      if (!card || card.dataset.draggable === '1') return;
      card.dataset.draggable = '1';
      var dragging = false;
      var moved = 0;
      var startX = 0, startY = 0, baseX = 0, baseY = 0;

      function clampCard(x, y) {
        var pad = 12;
        var maxX = Math.max(pad, window.innerWidth - card.offsetWidth - pad);
        var maxY = Math.max(pad, window.innerHeight - card.offsetHeight - pad);
        return {
          x: Math.min(Math.max(x, pad), maxX),
          y: Math.min(Math.max(y, pad), maxY)
        };
      }

      card.addEventListener('pointerdown', function (e) {
        if (e.button !== undefined && e.button !== 0) return;
        if (closeBtn && (e.target === closeBtn || closeBtn.contains(e.target))) return;
        if (e.target.closest && e.target.closest('select, input, textarea, a, button')) return;
        dragging = true;
        moved = 0;
        var r = card.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        baseX = r.left;
        baseY = r.top;
        // pin to viewport coords for free movement
        card.style.position = 'fixed';
        card.style.left = baseX + 'px';
        card.style.top = baseY + 'px';
        card.style.margin = '0';
        card.classList.add('dragging');
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      });

      card.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
        var p = clampCard(baseX + dx, baseY + dy);
        card.style.left = p.x + 'px';
        card.style.top = p.y + 'px';
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('dragging');
        if (moved < 6) {
          // clean click -> pop bounce
          card.classList.remove('card-pop');
          void card.offsetWidth;
          card.classList.add('card-pop');
          setTimeout(function () { card.classList.remove('card-pop'); }, 420);
        }
      }

      card.addEventListener('pointerup', endDrag);
      card.addEventListener('pointercancel', endDrag);
    }

    makeCardDraggable(profiles.logic.card, profiles.logic.closeBtn);
    makeCardDraggable(profiles.elijah.card, profiles.elijah.closeBtn);

    // Card transparency slider: higher = MORE see-through.
    // --card-alpha stays the tint opacity (1 = solid, 0 = invisible),
    // so transparency t = slider/100 maps to alpha = 1 - t.
    (function () {
      function applyAlpha(v, save) {
        var n = parseInt(v, 10);
        if (isNaN(n)) n = 26;
        n = Math.min(90, Math.max(5, n));
        document.documentElement.style.setProperty('--card-alpha', (1 - n / 100).toFixed(2));
        document.querySelectorAll('.alpha-slider').forEach(function (el) { el.value = String(n); });
        if (save !== false) { try { localStorage.setItem('bio-card-alpha', String(n)); } catch (e) {} }
      }
      var saved = null;
      try { saved = localStorage.getItem('bio-card-alpha'); } catch (e) {}
      if (saved) applyAlpha(saved, false);
      document.querySelectorAll('.alpha-slider').forEach(function (sl) {
        sl.addEventListener('input', function () { applyAlpha(sl.value, true); });
      });
    })();

    // Music autoplay nudge + mute toggle
    var audioIframe = document.getElementById("audio");
    var muteBtn = document.getElementById("mute-btn");
    var iconSound = document.getElementById("icon-sound");
    var iconMuted = document.getElementById("icon-muted");
    var isMuted = false;
    var widget = (window.SC && window.SC.Widget) ? window.SC.Widget(audioIframe) : null;

    function nudge() {
      if (audioIframe) {
        audioIframe.src = audioIframe.src;
      }
      window.removeEventListener("click", nudge);
      window.removeEventListener("keydown", nudge);
      window.removeEventListener("touchstart", nudge);
    }
    window.addEventListener("click", nudge);
    window.addEventListener("keydown", nudge);
    window.addEventListener("touchstart", nudge);
    nudge();

    muteBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      isMuted = !isMuted;

      if (isMuted) {
        iconSound.classList.add("hidden");
        iconMuted.classList.remove("hidden");
        muteBtn.classList.add("is-muted");
      } else {
        iconSound.classList.remove("hidden");
        iconMuted.classList.add("hidden");
        muteBtn.classList.remove("is-muted");
      }

      if (widget) {
        try {
          if (isMuted) {
            widget.setVolume(0);
          } else {
            widget.setVolume(100);
            widget.play();
          }
        } catch (err) {
          var vol = isMuted ? 0 : 100;
          audioIframe.contentWindow.postMessage(JSON.stringify({ method: "setVolume", value: vol }), "*");
        }
      } else {
        var vol = isMuted ? 0 : 100;
        audioIframe.contentWindow.postMessage(JSON.stringify({ method: "setVolume", value: vol }), "*");
      }
    });
  </script>
</body>
</html>
